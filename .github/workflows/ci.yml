name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # Check code formatting with clang-format
  format:
    runs-on: ubuntu-latest
    name: Format (clang-format)

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18
        sudo apt-get install -y clang-format-18

    - name: Check formatting
      run: |
        find src include -name '*.hpp' -o -name '*.cpp' | xargs clang-format-18 --dry-run --Werror

  # Static analysis with clang-tidy
  tidy:
    runs-on: ubuntu-latest
    name: Static Analysis (clang-tidy)

    steps:
    - uses: actions/checkout@v4

    - name: Install Clang 18
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18
        sudo apt-get install -y clang-tidy-18

    - name: Generate compile_commands.json
      env:
        CC: clang-18
        CXX: clang++-18
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DSTATIC_ASM_BUILD_TESTS=ON

    - name: Run clang-tidy
      run: |
        # Run clang-tidy on test files (which include the headers)
        # Filter to only report issues in src/ and include/ directories
        clang-tidy-18 -p build \
          --checks='-*,google-build-using-namespace,bugprone-*,modernize-use-override' \
          --header-filter='.*/(src|include)/.*\.hpp$' \
          tests/test_main.cpp 2>&1 | grep -E '^(src|include)/' || true

  # Linux builds with GCC and Clang
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc-13, cxx: g++-13, name: "GCC 13" }
          - { cc: gcc-14, cxx: g++-14, name: "GCC 14" }
          - { cc: clang-17, cxx: clang++-17, name: "Clang 17" }
          - { cc: clang-18, cxx: clang++-18, name: "Clang 18" }
        build_type: [Release, Debug]

    name: Linux ${{ matrix.compiler.name }} (${{ matrix.build_type }})

    steps:
    - uses: actions/checkout@v4

    - name: Install GCC 13
      if: matrix.compiler.cc == 'gcc-13'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-13 g++-13

    - name: Install GCC 14
      if: matrix.compiler.cc == 'gcc-14'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-14 g++-14

    - name: Install Clang 17
      if: matrix.compiler.cc == 'clang-17'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17

    - name: Install Clang 18
      if: matrix.compiler.cc == 'clang-18'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18

    - name: Configure CMake
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DSTATIC_ASM_BUILD_TESTS=ON \
          -DSTATIC_ASM_BUILD_EXAMPLES=OFF

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j $(nproc)

    - name: Test
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure -j $(nproc)

  # macOS builds with Apple Clang
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    name: macOS Clang (${{ matrix.build_type }})

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DSTATIC_ASM_BUILD_TESTS=ON \
          -DSTATIC_ASM_BUILD_EXAMPLES=OFF

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j $(sysctl -n hw.ncpu)

    - name: Test
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure -j $(sysctl -n hw.ncpu)

  # Windows MSVC builds
  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    name: Windows MSVC (${{ matrix.build_type }})

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        cmake -B build `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DSTATIC_ASM_BUILD_TESTS=ON `
          -DSTATIC_ASM_BUILD_EXAMPLES=OFF

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j $env:NUMBER_OF_PROCESSORS

    - name: Test
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure -j $env:NUMBER_OF_PROCESSORS

  # Windows Clang builds (clang-cl)
  windows-clang:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    name: Windows Clang (${{ matrix.build_type }})

    steps:
    - uses: actions/checkout@v4

    - name: Install LLVM
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "17.0"

    - name: Configure CMake
      run: |
        cmake -B build `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_C_COMPILER=clang-cl `
          -DCMAKE_CXX_COMPILER=clang-cl `
          -DSTATIC_ASM_BUILD_TESTS=ON `
          -DSTATIC_ASM_BUILD_EXAMPLES=OFF

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j $env:NUMBER_OF_PROCESSORS

    - name: Test
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure -j $env:NUMBER_OF_PROCESSORS

  # MinGW builds on Windows
  windows-mingw:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    name: Windows MinGW (${{ matrix.build_type }})

    steps:
    - uses: actions/checkout@v4

    - name: Set up MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja

    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DSTATIC_ASM_BUILD_TESTS=ON \
          -DSTATIC_ASM_BUILD_EXAMPLES=OFF

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --config ${{ matrix.build_type }} -j $(nproc)

    - name: Test
      shell: msys2 {0}
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure -j $(nproc)
